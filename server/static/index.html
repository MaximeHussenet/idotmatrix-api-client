<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDotMatrix Local</title>
<style>
  :root { --bg:#111417; --card:#1b2026; --fg:#e8eaed; --muted:#9aa3ad; --accent:#4da3ff; --ok:#3ecf72; --bad:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border-radius:10px; padding:14px; }
  button { background:#2a3340; color:var(--fg); border:0; border-radius:7px; padding:8px 12px; cursor:pointer; font-size:13px; }
  button:hover { background:#344050; }
  button.primary { background:var(--accent); color:#06121f; font-weight:600; }
  button.active { outline:2px solid var(--accent); background:#1d3350; }
  input[type=text], input[type=number], select { background:#10151a; color:var(--fg); border:1px solid #2c3540; border-radius:7px; padding:7px 9px; font-size:13px; }
  input[type=color] { width:42px; height:34px; border:0; background:none; padding:0; cursor:pointer; }
  input[type=range] { width:100%; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .dot.on { background:var(--ok); }
  #log { font:11px ui-monospace, monospace; color:var(--muted); max-width:1200px; margin:12px auto 0; white-space:pre-wrap; }
  canvas { border:1px solid #2c3540; border-radius:6px; image-rendering:pixelated; touch-action:none; cursor:crosshair; }
  .grow { flex:1; min-width:120px; }
  label { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<h1>⚡ iDotMatrix Local <span id="sizeTag" style="color:var(--muted);font-weight:400"></span></h1>
<div class="grid">

  <div class="card" style="grid-column:1/-1">
    <h2>Mode <span id="modeTag" style="color:var(--accent);text-transform:none;letter-spacing:0">—</span></h2>
    <div class="row">
      <button data-mode="bart" onclick="api('/bart/start', {interval_s:+$('bartInt').value}).then(bartRefresh)">🚇 BART map</button>
      <button data-mode="planes" onclick="planesStart()">✈️ Planes</button>
      <button data-mode="photos" onclick="photosStart()">📷 Photos</button>
      <button data-mode="spotify" onclick="api('/spotify/start').then(spotifyRefresh)">🎵 Spotify</button>
      <button data-mode="saver" onclick="saverStart()">🌀 Saver</button>
      <button data-mode="clock" onclick="api('/clock', {style:+$('clockStyle').value, color:$('clockColor').value})">🕐 Clock</button>
      <button data-mode="effect" onclick="api('/effect', {style:+$('fxStyle').value})">✨ Effect</button>
      <button data-mode="text" onclick="sendText()">📝 Text</button>
      <button data-mode="color" onclick="api('/color', {color:$('fsColor').value})">🎨 Color</button>
      <button data-mode="canvas" onclick="pushCanvas()">🖌 Canvas</button>
      <span class="grow"></span>
      <button onclick="api('/screen', {on:true})">💡 On</button>
      <button onclick="api('/screen', {on:false})">⬛ Off</button>
    </div>
    <div class="row"><label>One-click mode switch — each button uses the options set in its card below. Switching away from BART stops its refresh loop.</label></div>
  </div>

  <div class="card">
    <h2><span id="connDot" class="dot"></span>Connection</h2>
    <div class="row">
      <button id="scanBtn">Scan</button>
      <select id="devices" class="grow"><option value="">— saved / auto —</option></select>
    </div>
    <div class="row">
      <button class="primary" onclick="api('/connect', {address: document.getElementById('devices').value || null})">Connect</button>
      <button onclick="api('/disconnect')">Disconnect</button>
      <button onclick="api('/time/sync')">Sync time</button>
    </div>
    <div class="row">
      <button onclick="api('/screen', {on:true})">On</button>
      <button onclick="api('/screen', {on:false})">Off</button>
      <button onclick="api('/screen/flip')">Flip</button>
      <button onclick="api('/freeze')">Freeze</button>
    </div>
    <div class="row">
      <label>Brightness</label>
      <input type="range" id="bri" min="5" max="100" value="80"
             onchange="api('/brightness', {percent:+this.value})">
    </div>
    <div class="row">
      <label>Fullscreen color</label>
      <input type="color" id="fsColor" value="#2266ff">
      <button onclick="api('/color', {color: document.getElementById('fsColor').value})">Set</button>
    </div>
  </div>

  <div class="card">
    <h2>Text</h2>
    <div class="row"><input type="text" id="txt" class="grow" placeholder="Hello!" value="Hello!"></div>
    <div class="row">
      <select id="txtMode"></select>
      <select id="txtColorMode"></select>
      <input type="color" id="txtColor" value="#ffffff">
    </div>
    <div class="row">
      <label>Size</label><input type="number" id="txtSize" value="16" min="4" max="64" style="width:64px">
      <label>Speed</label><input type="number" id="txtSpeed" value="95" min="1" max="100" style="width:64px">
      <button class="primary" onclick="sendText()">Send</button>
    </div>
  </div>

  <div class="card">
    <h2>Clock &amp; Effects</h2>
    <div class="row">
      <select id="clockStyle"></select>
      <input type="color" id="clockColor" value="#ffffff">
      <button class="primary" onclick="api('/clock', {style:+document.getElementById('clockStyle').value, color:document.getElementById('clockColor').value})">Clock</button>
    </div>
    <div class="row">
      <select id="fxStyle"></select>
      <button onclick="api('/effect', {style:+document.getElementById('fxStyle').value})">Effect</button>
    </div>
    <div class="row">
      <label>Countdown</label>
      <input type="number" id="cdMin" value="5" min="0" max="99" style="width:56px"> m
      <input type="number" id="cdSec" value="0" min="0" max="59" style="width:56px"> s
      <button onclick="api('/countdown/start', {minutes:+cdMin.value, seconds:+cdSec.value})">Start</button>
      <button onclick="api('/countdown/stop')">Stop</button>
    </div>
    <div class="row">
      <label>Score</label>
      <input type="number" id="scHome" value="0" min="0" style="width:56px"> :
      <input type="number" id="scAway" value="0" min="0" style="width:56px">
      <button onclick="api('/scoreboard', {home:+scHome.value, away:+scAway.value})">Show</button>
    </div>
  </div>

  <div class="card">
    <h2>Image / GIF</h2>
    <div class="row"><input type="file" id="imgFile" accept="image/*"></div>
    <div class="row">
      <select id="imgResize"><option>fit</option><option>fill</option><option>stretch</option></select>
      <label><input type="checkbox" id="imgPal"> palletize</label>
      <button class="primary" onclick="sendFile()">Upload</button>
    </div>
    <div class="row"><label>PNG/JPG shows static, GIF animates. Scaled to panel size automatically.</label></div>
  </div>

  <div class="card">
    <h2>🚇 BART live map</h2>
    <div class="row">
      <button class="primary" onclick="api('/bart/start', {interval_s:+$('bartInt').value}).then(bartRefresh)">Start</button>
      <button onclick="api('/bart/stop').then(bartRefresh)">Stop</button>
      <label>every</label>
      <input type="number" id="bartInt" value="60" min="15" max="3600" style="width:64px"> s
      <span id="bartStatus" style="color:var(--muted);font-size:12px">—</span>
    </div>
    <div class="row">
      <img id="bartPreview" width="192" height="192" style="image-rendering:pixelated;border-radius:6px;border:1px solid #2c3540" alt="">
    </div>
    <div class="row"><label>Base map + BART lines, one dot per live train (line colors), refreshed every minute from BART GTFS-Realtime.</label></div>
  </div>

  <div class="card">
    <h2>✈️ Planes overhead</h2>
    <div class="row">
      <button class="primary" onclick="planesStart()">Start</button>
      <button onclick="api('/planes/stop').then(planesRefresh)">Stop</button>
      <span id="planesStatus" style="color:var(--muted);font-size:12px">—</span>
    </div>
    <div class="row">
      <label>Lat</label><input type="number" id="plLat" step="0.0001" style="width:92px">
      <label>Lon</label><input type="number" id="plLon" step="0.0001" style="width:92px">
      <button onclick="planesGeolocate()">📍 Get location</button>
    </div>
    <div class="row">
      <label>Radius</label><input type="number" id="plRad" min="1" max="250" style="width:56px"> nm
    </div>
    <div class="row">
      <label>Refresh</label><input type="number" id="plInt" min="10" max="3600" style="width:56px"> s
      <label>Rotate</label><input type="number" id="plRot" min="3" max="3600" style="width:56px"> s
    </div>
    <div class="row">
      <img id="planesPreview" width="192" height="192" style="image-rendering:pixelated;border-radius:6px;border:1px solid #2c3540" alt="">
    </div>
    <div class="row"><label>Callsign, route, type, altitude, speed + radar of nearby aircraft (adsb.lol + adsbdb). Cycles through planes when several are overhead.</label></div>
  </div>

  <div class="card">
    <h2>📷 Photos</h2>
    <div class="row">
      <button class="primary" onclick="photosStart()">Start</button>
      <button onclick="api('/photos/next').then(photosRefresh)">Next</button>
      <button onclick="api('/photos/stop').then(photosRefresh)">Stop</button>
      <span id="phStatus" style="color:var(--muted);font-size:12px">—</span>
    </div>
    <div class="row">
      <label>Folder</label><input type="text" id="phDir" class="grow" placeholder="~/Pictures/instagram">
    </div>
    <div class="row">
      <label>Rotate</label><input type="number" id="phRot" min="5" max="86400" style="width:64px"> s
      <label>Palette</label>
      <select id="phCol">
        <option value="0">full color</option>
        <option value="64">64 colors</option>
        <option value="32">32 colors</option>
        <option value="16">16 colors</option>
      </select>
    </div>
    <div class="row">
      <img id="phPreview" width="192" height="192" style="image-rendering:pixelated;border-radius:6px;border:1px solid #2c3540" alt="">
    </div>
    <div class="row"><label>Random pixelized pictures from a local folder (e.g. your Instagram data export) — shuffled, no repeats until the library cycles.</label></div>
  </div>

  <div class="card">
    <h2>🎵 Now Playing (Spotify)</h2>
    <div class="row">
      <button class="primary" onclick="api('/spotify/start').then(spotifyRefresh)">Start</button>
      <button onclick="api('/spotify/stop').then(spotifyRefresh)">Stop</button>
      <span id="spStatus" style="color:var(--muted);font-size:12px">—</span>
    </div>
    <div class="row">
      <img id="spPreview" width="192" height="192" style="image-rendering:pixelated;border-radius:6px;border:1px solid #2c3540" alt="">
    </div>
    <div class="row"><label>Album art + track/artist + progress bar from the Spotify desktop app (AppleScript — no API keys). Updates on track change, progress every 5s.</label></div>
  </div>

  <div class="card">
    <h2>🌀 Screensaver</h2>
    <div class="row">
      <button class="primary" onclick="saverStart()">Start</button>
      <button onclick="api('/saver/stop').then(saverRefresh)">Stop</button>
      <span id="svStatus" style="color:var(--muted);font-size:12px">—</span>
    </div>
    <div class="row">
      <select id="svStyle">
        <option value="snake">snake</option>
        <option value="life">game of life</option>
        <option value="mystify">mystify</option>
      </select>
      <label>New loop every</label>
      <input type="number" id="svCycle" min="30" max="86400" value="240" style="width:64px"> s
      <label>Frame</label>
      <input type="number" id="svFrameMs" min="40" max="2000" step="10" value="150" style="width:64px"> ms
    </div>
    <div class="row">
      <img id="svPreview" width="192" height="192" style="image-rendering:pixelated;border-radius:6px;border:1px solid #2c3540" alt="">
    </div>
    <div class="row"><label>Looping animation uploaded once as a GIF — the panel plays it by itself, no BLE traffic between refreshes.</label></div>
  </div>

  <div class="card" style="grid-column:1/-1">
    <h2>Pixel canvas</h2>
    <div class="row">
      <canvas id="cv" width="64" height="64" style="width:384px;height:384px"></canvas>
      <div>
        <div class="row">
          <input type="color" id="cvColor" value="#ff4444">
          <button onclick="cvErase=false">Draw</button>
          <button onclick="cvErase=true">Erase</button>
          <button onclick="cvClear()">Clear</button>
        </div>
        <div class="row"><button class="primary" onclick="pushCanvas()">Push to panel</button></div>
        <div class="row"><label>Click/drag to paint, then push. Uses the DIY image mode (full 24-bit color).</label></div>
      </div>
    </div>
  </div>

</div>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const logEl = $('log');
function note(msg, bad) {
  logEl.textContent = `${new Date().toLocaleTimeString()}  ${msg}\n` + logEl.textContent.split('\n').slice(0, 20).join('\n');
  logEl.style.color = bad ? 'var(--bad)' : 'var(--muted)';
}

async function api(path, body, raw) {
  try {
    const opts = { method: 'POST' };
    if (raw) { opts.body = raw; }
    else if (body !== undefined) { opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
    const r = await fetch(path, opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.status);
    note(`${path} ✓ ${JSON.stringify(j)}`);
    refreshStatus();
    return j;
  } catch (e) { note(`${path} ✗ ${e.message}`, true); throw e; }
}

async function refreshStatus() {
  try {
    const s = await (await fetch('/status')).json();
    $('connDot').className = 'dot' + (s.connected ? ' on' : '');
    $('sizeTag').textContent = `${s.size}×${s.size}` + (s.address ? ` · ${s.address.slice(0,13)}…` : '');
    $('modeTag').textContent = s.mode ? s.mode + (s.mode_detail ? ` · ${s.mode_detail}` : '') : '—';
    for (const b of document.querySelectorAll('button[data-mode]'))
      b.classList.toggle('active', b.dataset.mode === s.mode);
  } catch {}
}

$('scanBtn').onclick = async () => {
  note('scanning… (≈10s)');
  const j = await api('/scan');
  const sel = $('devices');
  sel.innerHTML = '<option value="">— saved / auto —</option>';
  for (const d of j.devices) sel.add(new Option(d, d));
  if (j.devices.length) sel.value = j.devices[0];
  note(`found ${j.devices.length} device(s)`);
};

function sendText() {
  const cm = $('txtColorMode').value;
  api('/text', {
    text: $('txt').value, font_size: +$('txtSize').value, speed: +$('txtSpeed').value,
    mode: +$('txtMode').value,
    color_mode: cm === 'RGB' ? 'RGB' : cm,
    color: cm === 'RGB' ? $('txtColor').value : null,
  });
}

async function sendFile() {
  const f = $('imgFile').files[0];
  if (!f) return note('pick a file first', true);
  const fd = new FormData(); fd.append('file', f);
  const isGif = /\.gif$/i.test(f.name);
  const url = `/${isGif ? 'gif' : 'image'}?resize=${$('imgResize').value}` + (!isGif && $('imgPal').checked ? '&palletize=true' : '');
  note(`uploading ${f.name}…`);
  await api(url, undefined, fd);
}

// ---- pixel canvas ----
const cv = $('cv'), ctx = cv.getContext('2d');
let cvErase = false, painting = false;
function cvClear(){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 64, 64); }
cvClear();
function paint(e) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * 64);
  const y = Math.floor((e.clientY - r.top) / r.height * 64);
  if (x < 0 || y < 0 || x > 63 || y > 63) return;
  ctx.fillStyle = cvErase ? '#000' : $('cvColor').value;
  ctx.fillRect(x, y, 1, 1);
}
cv.addEventListener('pointerdown', e => { painting = true; cv.setPointerCapture(e.pointerId); paint(e); });
cv.addEventListener('pointermove', e => painting && paint(e));
cv.addEventListener('pointerup', () => painting = false);

function pushCanvas() {
  const d = ctx.getImageData(0, 0, 64, 64).data, px = [];
  for (let i = 0; i < d.length; i += 4) px.push([d[i], d[i+1], d[i+2]]);
  note('pushing canvas…');
  api('/canvas', { pixels: px });
}

// ---- BART mode ----
async function bartRefresh() {
  try {
    const s = await (await fetch('/bart/status')).json();
    const when = s.last_update ? new Date(s.last_update * 1000).toLocaleTimeString() : 'never';
    $('bartStatus').textContent =
      (s.running ? `running · ${s.trains ?? '?'} trains · updated ${when}` : 'stopped') +
      (s.last_error ? ` · ⚠ ${s.last_error}` : '');
    if (s.last_update) $('bartPreview').src = '/bart/frame.png?t=' + s.last_update;
  } catch {}
}
bartRefresh();
setInterval(bartRefresh, 15000);

// ---- planes mode ----
function planesStart() {
  api('/planes/start', {
    lat: +$('plLat').value, lon: +$('plLon').value, radius_nm: +$('plRad').value,
    interval_s: +$('plInt').value, rotate_s: +$('plRot').value,
  }).then(planesRefresh);
}
function planesGeolocate() {
  if (!navigator.geolocation) return note('geolocation not supported by this browser', true);
  note('getting location…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      $('plLat').value = pos.coords.latitude.toFixed(4);
      $('plLon').value = pos.coords.longitude.toFixed(4);
      note(`location set: ${$('plLat').value}, ${$('plLon').value} — hit Start to apply`);
    },
    err => note(`geolocation failed: ${err.message}`, true),
    { enableHighAccuracy: true, timeout: 15000 },
  );
}
let planesCfgLoaded = false;
async function planesRefresh() {
  try {
    const s = await (await fetch('/planes/status')).json();
    if (!planesCfgLoaded) {
      planesCfgLoaded = true;
      $('plLat').value = s.config.lat; $('plLon').value = s.config.lon;
      $('plRad').value = s.config.radius_nm; $('plInt').value = s.config.interval_s;
      $('plRot').value = s.config.rotate_s;
    }
    const when = s.last_update ? new Date(s.last_update * 1000).toLocaleTimeString() : 'never';
    $('planesStatus').textContent =
      (s.running ? `running · ${s.planes ?? '?'} planes · ${s.featured || 'no traffic'} · ${when}` : 'stopped') +
      (s.last_error ? ` · ⚠ ${s.last_error}` : '');
    if (s.running && s.last_update) $('planesPreview').src = '/planes/frame.png?t=' + Date.now();
  } catch {}
}
planesRefresh();
setInterval(planesRefresh, 8000);

// ---- photos mode ----
function photosStart() {
  api('/photos/start', {
    dir: $('phDir').value || null, rotate_s: +$('phRot').value || null, colors: +$('phCol').value,
  }).then(photosRefresh);
}
let photosCfgLoaded = false;
async function photosRefresh() {
  try {
    const s = await (await fetch('/photos/status')).json();
    if (!photosCfgLoaded) {
      photosCfgLoaded = true;
      $('phDir').value = s.config.dir; $('phRot').value = s.config.rotate_s;
      $('phCol').value = s.config.colors;
    }
    $('phStatus').textContent =
      (s.running ? `running · ${s.library ?? '?'} pics · ${s.showing || '…'}` : 'stopped') +
      (s.last_error ? ` · ⚠ ${s.last_error}` : '');
    if (s.running && s.last_update) $('phPreview').src = '/photos/frame.png?t=' + s.last_update;
  } catch {}
}
photosRefresh();
setInterval(photosRefresh, 10000);

// ---- spotify mode ----
async function spotifyRefresh() {
  try {
    const s = await (await fetch('/spotify/status')).json();
    $('spStatus').textContent =
      (s.running ? `${s.state || '…'}${s.track ? ` · ${s.track} — ${s.artist}` : ''}` : 'stopped') +
      (s.last_error ? ` · ⚠ ${s.last_error}` : '');
    if (s.running && s.last_update) $('spPreview').src = '/spotify/frame.png?t=' + s.last_update;
  } catch {}
}
spotifyRefresh();
setInterval(spotifyRefresh, 8000);

// ---- saver mode ----
function saverStart() {
  api('/saver/start', {
    style: $('svStyle').value, cycle_s: +$('svCycle').value, frame_ms: +$('svFrameMs').value,
  }).then(saverRefresh);
}
async function saverRefresh() {
  try {
    const s = await (await fetch('/saver/status')).json();
    $('svStatus').textContent =
      (s.running ? `running · ${s.style}` : 'stopped') +
      (s.last_error ? ` · ⚠ ${s.last_error}` : '');
    if (s.running && s.last_update) $('svPreview').src = '/saver/preview.gif?t=' + s.last_update;
  } catch {}
}
saverRefresh();
setInterval(saverRefresh, 15000);

// ---- populate enums ----
(async () => {
  const e = await (await fetch('/enums')).json();
  const fill = (sel, obj, pretty) => {
    for (const [name, val] of Object.entries(obj)) sel.add(new Option(pretty ? name.replace(/_/g,' ').toLowerCase() : name, typeof val === 'number' ? val : name));
  };
  fill($('txtMode'), e.text_modes, true); $('txtMode').value = e.text_modes.MARQUEE;
  for (const name of Object.keys(e.text_color_modes)) $('txtColorMode').add(new Option(name.replace(/_/g,' ').toLowerCase(), name));
  $('txtColorMode').value = 'RGB';
  fill($('clockStyle'), e.clock_styles); $('clockStyle').value = e.clock_styles.Color;
  fill($('fxStyle'), e.effect_styles, true);
  refreshStatus();
  setInterval(refreshStatus, 10000);
})();
</script>
</body>
</html>
